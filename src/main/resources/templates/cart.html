<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Giỏ hàng</title>
</head>
<body>
    <div layout:fragment="content">
        <h1 class="mb-4">Giỏ hàng của bạn</h1>

        <!-- Empty Cart Message -->
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
            <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
            <h3>Giỏ hàng trống</h3>
            <p class="text-muted">Hãy thêm sản phẩm vào giỏ hàng của bạn</p>
            <a th:href="@{/}" class="btn btn-primary mt-3">Tiếp tục mua sắm</a>
        </div>

        <!-- Cart Items -->
        <div th:if="${not #lists.isEmpty(cartItems)}" class="row">
            <div class="col-lg-8">
                <div class="card mb-4">
                    <div class="card-body">
                        <!-- Cart Item -->
                        <div th:each="item : ${cartItems}" class="row mb-4 border-bottom pb-4">
                            <div class="col-md-2">
                                <img th:src="${item.manga.coverImage}" class="img-fluid rounded" alt="Product Image">
                            </div>
                            <div class="col-md-5">
                                <h5 class="card-title" th:text="${item.manga.title}">Tên truyện</h5>
                                <p class="text-muted mb-2">
                                    <small>
                                        Tác giả: <span th:text="${item.manga.author.name}">Tên tác giả</span>
                                    </small>
                                </p>
                                <button class="btn btn-link text-danger p-0" 
                                        th:data-item-id="${item.id}"
                                        onclick="removeFromCart(this.getAttribute('data-item-id'))">
                                    <i class="fas fa-trash-alt"></i> Xóa
                                </button>
                            </div>
                            <div class="col-md-3">
                                <div class="input-group" style="width: 120px;">
                                    <button class="btn btn-outline-secondary" type="button" 
                                            th:onclick="'updateQuantity(' + ${item.id} + ', -1)'">-</button>
                                    <input type="number" class="form-control text-center" 
                                           th:value="${item.quantity}" min="1" max="99"
                                           th:onchange="'updateQuantity(' + ${item.id} + ', this.value)'">
                                    <button class="btn btn-outline-secondary" type="button"
                                            th:onclick="'updateQuantity(' + ${item.id} + ', 1)'">+</button>
                                </div>
                            </div>
                            <div class="col-md-2 text-end">
                                <p class="price mb-0" th:text="${#numbers.formatDecimal(item.manga.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                    150,000 đ
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title mb-4">Tổng đơn hàng</h5>
                        
                        <div class="d-flex justify-content-between mb-3">
                            <span>Tạm tính</span>
                            <span class="price" th:text="${#numbers.formatDecimal(subtotal, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                300,000 đ
                            </span>
                        </div>
                        
                        <div class="d-flex justify-content-between mb-3">
                            <span>Phí vận chuyển</span>
                            <span class="price" th:text="${#numbers.formatDecimal(shippingFee, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                30,000 đ
                            </span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Giảm giá</span>
                            <span class="text-danger" th:text="'-' + ${#numbers.formatDecimal(discount, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                -30,000 đ
                            </span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <strong>Tổng cộng</strong>
                            <strong class="price" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                300,000 đ
                            </strong>
                        </div>

                        <!-- Coupon Code -->
                        <div class="mb-4">
                            <div class="input-group">
                                <input type="text" class="form-control" placeholder="Mã giảm giá" id="couponCode">
                                <button class="btn btn-outline-primary" type="button" onclick="applyCoupon()">
                                    Áp dụng
                                </button>
                            </div>
                        </div>

                        <a th:href="@{/checkout}" class="btn btn-primary w-100">
                            Tiến hành thanh toán
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <th:block layout:fragment="javascript">
        <script>
            function updateQuantity(itemId, change) {
                let input = document.querySelector(`input[data-item-id="${itemId}"]`);
                let currentValue = parseInt(input.value);
                let newValue;
                
                if (typeof change === 'string') {
                    newValue = parseInt(change);
                } else {
                    newValue = currentValue + change;
                }

                if (newValue >= 1 && newValue <= 99) {
                    fetch(`/api/cart/update/${itemId}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ quantity: newValue })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            location.reload();
                        }
                    });
                }
            }

            function removeFromCart(itemId) {
                if (confirm('Bạn có chắc muốn xóa sản phẩm này khỏi giỏ hàng?')) {
                    fetch(`/api/cart/remove/${itemId}`, {
                        method: 'POST'
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            location.reload();
                        }
                    });
                }
            }

            function applyCoupon() {
                const couponCode = document.getElementById('couponCode').value;
                fetch('/api/cart/apply-coupon', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ couponCode: couponCode })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        location.reload();
                    } else {
                        alert(data.message);
                    }
                });
            }
        </script>
    </th:block>
</body>
</html>
