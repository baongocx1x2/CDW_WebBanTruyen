<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div id="login" class="card-body">
    <form action="login" method="post">
        <div class="mb-3">
            <input type="email" name="email" class="form-control"
                   id="InputEmail" aria-describedby="emailHelp" autofocus="autofocus"
                   placeholder="<fmt:message key='login.email' />" required="required">
        </div>
        <div class="mb-3">
            <input type="password" name="password" class="form-control"
                   id="InputPassword" placeholder="<fmt:message key='login.pwd' />" required="required">
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input"
                   id="exampleCheck1">
            <label class="form-check-label" for="exampleCheck1">
                <fmt:message key="login.save" />
            </label>
        </div>
        <p class="forgot">
            <a href="#"><fmt:message key="login.forgot" /></a>
        </p>

        <div id="top-header" class="btn-group" role="group" aria-label="Basic example">
            <button type="submit" class="btn btn-primary btn-block">
                <fmt:message key="login.title" />
            </button>
            <a href="signUp.jsp" class="px-5 btn btn-primary">
                <fmt:message key="signUp.title" />
            </a>
        </div>
    </form>
</div>



</body>
</html>
