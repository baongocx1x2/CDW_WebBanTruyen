<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width
    , initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Comicop(beta)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            text-align: center;
        }
        .locale-buttons {
            margin: 20px 0;
        }
        button {
            margin: 0 5px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .nav-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<div>
    <h1 th:text="#{greeting}"/>
    <h2 th:text="#{cool}"/>
    <p>
        <span th:text="#{rd}"/>
    </p>

    <button onclick="window.location.href='/?lang=en'" th:text="#{lang.en}">English</button>
    <button onclick="window.location.href='/?lang=vi'" th:text="#{lang.vi}">Tiếng Việt</button>

    <div>
        <a th:href="@{/accounts}" class="nav-link">Account Management</a>
    </div>
</div>
</body>
</html>
